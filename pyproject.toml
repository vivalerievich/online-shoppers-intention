[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "online-shoppers-intention"
version = "0.1.0"
description = "Predict purchasing intention from online shopping sessions"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
]

[project.scripts]
train-shoppers = "online_shoppers_intention.train:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.15"]
notebook = ["jupyterlab>=4,<5", "matplotlib>=3.9,<4", "seaborn>=0.13,<0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
